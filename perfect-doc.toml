include = ["**/*.md"]
exclude = [
    "**/.git/**",
    "**/node_modules/**",
    "**/.playwright-cli/**",
    "output/**",
    "playwright-report/**",
    "test-results/**",
    "dist/**",
]
required_paths = ["README.md", "AGENTS.md", "docs/index.md", "docs/QUALITY.md"]

[markdown]
dialect = "gfm"
anchors = "github"

[links]
index_files = ["index.md", "README.md", "index.html"]
allow_outside_root = false
strict_case = true

[routes]
enabled = false

[network]
enabled = false
